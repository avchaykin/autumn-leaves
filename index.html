<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Autumn Leaves Map</title>
  <meta name="description" content="Map of autumn leaf colour computed from tree species and temperature history, with forecast.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍁</text></svg>">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="map" aria-label="Map"></div>

  <section class="panel controls" aria-label="Controls">
    <header>
      <h1>Autumn leaves</h1>
      <p class="sub">Modelled leaf colour from tree species and temperatures</p>
    </header>

    <div class="row">
      <label for="season">Season</label>
      <select id="season"></select>
    </div>

    <div class="date-block">
      <div class="date-head">
        <strong id="date-label">–</strong>
        <span id="date-kind" class="badge">–</span>
      </div>
      <div class="slider-wrap">
        <input id="date" type="range" min="0" max="100" value="0" aria-label="Date">
        <div id="slider-zones" class="slider-zones" aria-hidden="true"></div>
      </div>
      <div id="slider-ticks" class="slider-ticks" aria-hidden="true"></div>
      <div class="slider-legend">
        <span><i class="z observed"></i>Observed</span>
        <span><i class="z forecast"></i>Forecast 16 d</span>
        <span><i class="z outlook"></i>Outlook (normals)</span>
      </div>
      <div class="buttons">
        <button id="today" type="button">Today</button>
        <button id="play" type="button" aria-pressed="false">
          <svg class="icon i-play" viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 3.2v9.6a.6.6 0 0 0 .9.5l7.6-4.8a.6.6 0 0 0 0-1L5.4 2.7a.6.6 0 0 0-.9.5Z"/></svg>
          <svg class="icon i-pause" viewBox="0 0 16 16" aria-hidden="true"><rect x="4" y="3" width="2.8" height="10" rx=".6"/><rect x="9.2" y="3" width="2.8" height="10" rx=".6"/></svg>
          <span>Play</span>
        </button>
      </div>
    </div>

    <details class="species" id="species" open>
      <summary id="species-title">Leaves near the map centre</summary>
      <ul id="species-list" class="species-list"></ul>
    </details>

    <div class="legend" aria-label="Legend">
      <div class="legend-title">Canopy</div>
      <div class="swatches">
        <span><i style="background:#4a7a2e"></i>Green</span>
        <span><i style="background:#c8b040"></i>Turning</span>
        <span><i style="background:#e0902a"></i>Peak gold</span>
        <span><i style="background:#c8442a"></i>Peak red</span>
        <span><i style="background:#8a5a32"></i>Brown</span>
        <span><i style="background:#7a6a5c"></i>Bare</span>
      </div>
      <p class="hint" id="zoom-hint">Zoom in further to see individual forests.</p>
    </div>

    <div id="status" class="status" role="status" aria-live="polite"></div>
  </section>

  <aside id="detail" class="panel detail" hidden aria-label="Location details">
    <button id="detail-close" class="close" type="button" aria-label="Close details">
      <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" fill="none"/></svg>
    </button>
    <div id="detail-body"></div>
  </aside>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
